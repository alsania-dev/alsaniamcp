version: '3.8'

services:
  alsaniamcp:
    build: .
    image: alsaniamcp/mcp:latest
    container_name: alsaniamcp-server
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - SESSION_SECRET=${SESSION_SECRET:-default-secret-change-me}
    volumes:
      - ./config:/app/config
      - alsaniamcp-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  alsaniamcp-data:
